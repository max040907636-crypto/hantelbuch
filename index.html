<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Hantelbuch – Trainingsplan, Trainings-Tagebuch und Dehnplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hantelbuch">
<style>/* Grundeinstellungen für die eigene Web-App (Abstand zur Handy-Kerbe) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}</style>
<title>Hantelbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: eine schmale Handy-Spalte (max. 600 px). Oben Kopfzeile, unten Tabs.
   Look: nur Schwarz und Weiß (plus Grautöne) – hell: weißer Grund, dunkel: schwarzer Grund. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f2f2f2; --line:#e3e3e3;
  --fg:#0a0a0a; --muted:#6b6b6b; --inv:#ffffff;
  --muscle:#ececec; --heat1:#c9c9c9; --heat2:#7d7d7d; --heat3:#0a0a0a;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav-h:62px; --vid-filter:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#0b0b0b; --soft:#171717; --line:#2a2a2a;
  --fg:#f7f7f7; --muted:#a3a3a3; --inv:#000000;
  --muscle:#1f1f1f; --heat1:#3d3d3d; --heat2:#8f8f8f; --heat3:#f7f7f7; --vid-filter:invert(1);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0b0b0b; --soft:#171717; --line:#2a2a2a;
  --fg:#f7f7f7; --muted:#a3a3a3; --inv:#000000;
  --muscle:#1f1f1f; --heat1:#3d3d3d; --heat2:#8f8f8f; --heat3:#f7f7f7; --vid-filter:invert(1);
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a{color:var(--fg)}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:18px}
/* Kleine Handys: Kopfzeile kompakter, damit alle Knöpfe passen */
@media (max-width:440px){.top-in{gap:8px}.brand{font-size:20px;letter-spacing:.04em;gap:6px}.brand svg{width:24px;height:16px}.sync span{display:none}}
@media (max-width:370px){.brand{font-size:18px}.icon-btn{width:38px;height:38px}}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.sync i{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none}
.sync.cloud i{background:var(--fg);border-color:var(--fg)}
.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){ .sync span{display:none} }
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Inhalt */
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,9vw,42px);font-weight:700;overflow-wrap:anywhere}
.focus h1{font-size:clamp(28px,8vw,36px)}
h2{font-size:28px;font-weight:700}
h3{font-size:21px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.ink{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.card.ink .muted,.card.ink .eyebrow{color:var(--inv);opacity:.7}
.card.note{border:2px solid var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-weight:700}
.chip.solid{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:12px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);font-weight:700;font-size:17px;text-decoration:none}
.btn.primary{background:var(--fg);color:var(--inv)}
.btn:disabled{opacity:.35}
.card.ink .btn.primary{background:var(--inv);color:var(--fg);border-color:var(--inv)}
.card.ink .btn{border-color:var(--inv);color:var(--inv);background:transparent}
.btn.block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 130px}
.link{background:none;border:0;padding:4px 0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:left}
.big{font-family:var(--f-display);font-size:72px;line-height:.85;font-weight:700;font-variant-numeric:tabular-nums}
.big-row{display:flex;align-items:flex-end;gap:12px}

/* Hantelscheibe als Tages-Abzeichen */
.plate{width:48px;height:48px;border-radius:50%;background:var(--fg);color:var(--inv);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;flex:none;position:relative}
.plate::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid var(--inv);opacity:.5}
.card.ink .plate{background:var(--inv);color:var(--fg)}
.card.ink .plate::after{border-color:var(--fg)}
.day-head{display:flex;gap:12px;align-items:center}
.day-head > div{min-width:0}

/* Listen */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;padding:12px 0;text-align:left}
.row b{font-weight:700;display:block}
.row small{display:block;color:var(--muted);font-size:13px}
.row .num{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--fg);padding-bottom:4px}

/* Woche (Mo–So) und Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.cal button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid transparent;background:transparent;font-family:var(--f-display);font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px;padding:0}
.cal small{font-size:10px;font-family:var(--f-body);font-weight:700}
.st-planned{border:2px dashed var(--fg)!important}
.st-today{border:2px solid var(--fg)!important}
.st-done{background:var(--fg)!important;color:var(--inv)}
.st-draft{background:var(--soft)!important;border:2px solid var(--fg)!important}
.st-missed{border:2px solid var(--muted)!important;color:var(--muted);text-decoration:line-through}
.st-excused{background:var(--soft)!important;color:var(--muted)}
.is-today{box-shadow:0 0 0 3px var(--bg) inset,0 0 0 5px var(--fg) inset}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{flex:1;text-align:center;font-size:24px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{border:2px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;color:var(--muted);min-width:0}
.badge b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.badge span{font-size:12px;font-weight:700}
.badge.got{border:2px solid var(--fg);background:var(--fg);color:var(--inv)}

/* Video */
.vid-box{background:#ffffff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:1;max-width:100%;filter:var(--vid-filter)}
.vid-box video{width:100%;height:100%;display:block;object-fit:cover}
.vid-none{display:grid;place-items:center;color:#6b6b6b;font-size:14px;height:100%;padding:16px;text-align:center}

/* Training */
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--fg)}
.prog i.now{background:var(--muted)}
.tr-top{display:flex;align-items:center;gap:10px}
.tr-top .grow{flex:1;min-width:0}
/* Deutlicher Zurück-Knopf oben im Training */
.back-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);font-weight:700;font-size:16px;flex:none}
.hint{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.prev{font-size:13px;color:var(--muted)}
/* Gewicht: zum Aufklappen mit Pfeil */
.wt{border:2px solid var(--fg);border-radius:var(--r);background:var(--surface)}
.wt > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.wt > summary::-webkit-details-marker{display:none}
.wt .arr{font-size:22px;line-height:1;display:inline-block;width:20px;text-align:center}
.wt[open] .arr{transform:rotate(90deg)}
.wt .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.wt summary b{font-family:var(--f-display);font-size:30px;line-height:1}
.wt-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) auto 64px;gap:8px;align-items:center}
.stepper button{height:60px;border-radius:12px;border:2px solid var(--fg);background:var(--surface);font-size:32px;font-weight:700;line-height:1}
.stepper input{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--f-display);font-size:34px;font-weight:700;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.stepper span{font-weight:700}
.lv{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--fg);color:var(--inv);font-weight:700;font-size:14px;white-space:nowrap}
.meter{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.meter span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);min-width:0;text-align:center}
.meter i{display:block;width:100%;height:10px;border-radius:5px;background:var(--line)}
.meter .on i{background:var(--fg)}
.meter .cur{color:var(--fg)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:30px minmax(56px,auto) minmax(0,1fr) 54px;gap:8px;align-items:center}
.set-h span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:center}
.set{padding:4px;border-radius:10px}
.set.ok{background:var(--soft)}
.set-n{font-family:var(--f-display);font-size:19px;font-weight:700;text-align:center;color:var(--muted)}
.set-kg{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;text-align:right}
.set input{width:100%;height:50px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.set input::placeholder{color:var(--muted);opacity:.8;font-size:17px}
.chk{width:54px;height:50px;border-radius:10px;border:2px solid var(--fg);background:var(--surface);font-size:24px;font-weight:700;color:var(--fg)}
.set.ok .chk{background:var(--fg);color:var(--inv)}
details.how{border-top:1px solid var(--line);padding-top:10px}
details.how summary{cursor:pointer;font-weight:700}
.prose{display:flex;flex-direction:column;gap:8px;max-width:65ch}
.prose ol,.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.nav-row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.feel{display:flex;gap:6px;flex-wrap:wrap}
.feel button{flex:1 1 52px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.feel button.on{background:var(--fg);color:var(--inv);border-color:var(--fg)}
textarea{width:100%;min-height:72px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* Dehnen */
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.daychips button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0}
.daychips button.on{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.daychips button.today{box-shadow:0 0 0 2px var(--fg) inset}
.daychips button.on.today{box-shadow:none}
/* Filter-Knöpfe (3 bzw. 4 nebeneinander) */
.daychips.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.daychips.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Level-Seite: Fortschrittsbalken bis zum nächsten Level */
.lvbar{display:block;height:8px;border-radius:4px;background:var(--line);margin:6px 0 4px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--fg);border-radius:4px}
.wt-line{display:flex;align-items:center;gap:10px;border:2px solid var(--fg);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.wt-line .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.wt-line b{font-family:var(--f-display);font-size:28px}
.small-btn{min-height:44px;padding:0 12px;font-size:15px}
.kgrow{padding:12px 0;display:flex;flex-direction:column;gap:8px}
.kg-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kg-name{font-size:17px;text-align:left}
.stepper.sm button{height:48px;font-size:26px}
.stepper.sm input{height:48px;font-size:26px}
.stepper.sm{grid-template-columns:52px minmax(0,1fr) auto 52px}
.stepper.sm span{font-size:13px;white-space:nowrap;color:var(--muted)}
.lv.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
.card.ink .chip{border-color:var(--inv);color:var(--inv)}
.icon-btn[aria-current="page"]{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.play{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--inv);display:grid;place-items:center;font-size:14px;flex:none}

/* Fortschritt */
.bodymap svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.mbars{display:flex;flex-direction:column;gap:7px}
.mbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px}
.mbar .track{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;border-left:2px dotted var(--muted);border-right:2px dotted var(--muted)}
.mbar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:var(--fg)}
.mbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:var(--nav-h)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700}
.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--fg)}
.focus .tabs{display:none}

/* Pausen-Timer */
.timer{position:fixed;z-index:24;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.focus .timer{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.timer-in{max-width:568px;margin:0 auto;background:var(--fg);color:var(--inv);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;overflow:hidden;position:relative}
.timer-in .t{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer-in .lbl{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-in .tb{display:flex;gap:6px}
.timer-in .tb button{min-height:42px;padding:0 10px;border-radius:9px;border:1px solid var(--inv);background:transparent;color:var(--inv);font-weight:700;font-size:14px}
.timer-in .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--inv);opacity:.6}

/* Fenster von unten */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--fg);color:var(--inv);padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.flash{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}

  .wt .arr{transition:transform .2s}
  .flash{animation:pop .5s ease-in-out 4}
  @keyframes pop{50%{transform:scale(1.15)}}
}

const EX = {
  schulterdruecken:{name:"Schulterdrücken sitzend",art:"Kurzhanteln",p:["schultern"],s:["trizeps"],sets:2,min:8,max:12,rest:120,inc:2,start:{kg:8,von:6,bis:10,wie:" je Hand"},std:[15,21,29,39,49],
    how:["Bank fast senkrecht stellen.","Hanteln auf Schulterhöhe, Handflächen nach vorne.","Nach oben drücken, bis die Arme fast gestreckt sind.","Langsam zurück bis etwa Kinnhöhe."],fehler:["Hohlkreuz machen.","Hanteln oben zusammenknallen."],tipp:"Rücken bleibt an der Lehne, Bauch leicht angespannt.",yt:"Kurzhantel Schulterdrücken sitzend richtige Ausführung"},
  seitheben:{name:"Seitheben",art:"Kurzhanteln",p:["schultern"],s:[],sets:2,min:12,max:15,rest:90,inc:1,start:{kg:3,von:2,bis:4,wie:" je Hand"},std:[4,9,15,23,32],
    how:["Aufrecht stehen, Arme leicht gebeugt.","Hanteln seitlich bis etwa Schulterhöhe heben – die Ellbogen führen.","Kurz halten, langsam absenken."],fehler:["Schwung aus dem Körper.","Schultern zu den Ohren ziehen."],tipp:"Leichtes Gewicht reicht. Wenn du schwingen musst, ist es zu schwer.",yt:"Seitheben Kurzhantel richtige Ausführung"},
  reverse_fly:{name:"Reverse Butterfly",art:"Maschine",p:["oben"],s:["schultern"],sets:2,min:12,max:15,rest:90,inc:2.5,start:{kg:15,von:10,bis:20,wie:""},std:[24,39,59,82,109],
    how:["Maschine auf „Reverse“ stellen, Brust ans Polster.","Griffe auf Schulterhöhe, Arme leicht gebeugt.","Arme nach hinten-außen ziehen, Schulterblätter zusammen.","Langsam zurück."],fehler:["Schultern hochziehen.","Mit Schwung arbeiten."],tipp:"Kleine Muskeln – leicht anfangen. Gut für die Haltung.",yt:"Reverse Butterfly Maschine richtige Ausführung"},
  curls:{name:"Kurzhantel-Curls",art:"Kurzhanteln",p:["bizeps"],s:[],sets:2,min:10,max:15,rest:90,inc:1,start:{kg:6,von:5,bis:8,wie:" je Hand"},std:[7,12,20,29,40],
    how:["Aufrecht stehen, Ellbogen seitlich am Körper.","Hanteln hochbeugen, Handflächen zeigen nach oben.","Oben kurz anspannen, langsam ablassen."],fehler:["Schwung aus dem Rücken.","Ellbogen wandern nach vorne."],tipp:"Wenn du schaukeln musst, nimm die leichtere Hantel.",yt:"Bizeps Curls Kurzhantel richtige Ausführung"},
  hammercurls:{name:"Hammer-Curls",art:"Kurzhanteln",p:["bizeps"],s:[],sets:2,min:10,max:15,rest:90,inc:1,start:{kg:6,von:5,bis:8,wie:" je Hand"},std:[9,14,21,29,39],
    how:["Hanteln seitlich, Daumen zeigen nach vorne.","Ellbogen bleiben am Körper.","Hochbeugen – die Handflächen schauen zueinander.","Langsam ablassen."],fehler:["Schwung aus dem Rücken.","Ellbogen wandern nach vorne."],tipp:"Trifft auch den Unterarm – macht den Oberarm dicker.",yt:"Hammer Curls richtige Ausführung"},
  kabelcurls:{name:"Bizeps-Curls am Kabel",art:"Kabelzug (Stange)",p:["bizeps"],s:[],sets:2,min:10,max:15,rest:90,inc:2.5,start:{kg:10,von:7.5,bis:15,wie:""},std:[17,29,46,67,91],
    how:["Gerade Stange am unteren Kabelzug.","Aufrecht stehen, Ellbogen am Körper.","Stange hochbeugen bis kurz vor die Schultern.","Langsam ablassen."],fehler:["Mit dem Rücken nachhelfen.","Ellbogen wandern nach vorne."],tipp:"Das Kabel hält den Bizeps auch unten unter Spannung.",yt:"Bizeps Curls am Kabel richtige Ausführung"},
  trizeps:{name:"Trizepsdrücken am Kabel",art:"Kabelzug (Seil)",p:["trizeps"],s:[],sets:2,min:10,max:15,rest:90,inc:2.5,start:{kg:10,von:10,bis:20,wie:""},std:[14,26,41,60,82],
    how:["Seil am oberen Kabelzug, aufrecht davor stehen.","Ellbogen eng am Körper – die Oberarme bewegen sich nicht.","Seil nach unten drücken, bis die Arme gestreckt sind.","Langsam zurück."],fehler:["Ellbogen wandern nach vorne.","Oberkörper drückt mit."],tipp:"Nur die Unterarme bewegen sich – wie ein Scharnier.",yt:"Trizepsdrücken am Kabel Seil richtige Ausführung"},
  ueberkopf_trizeps:{name:"Trizepsdrücken über Kopf",art:"Kabelzug (Seil)",p:["trizeps"],s:[],sets:2,min:10,max:15,rest:90,inc:2.5,start:{kg:10,von:7.5,bis:15,wie:""},std:[11,22,37,57,79],
    how:["Seil am Kabelzug auf Hüfthöhe, umdrehen, Seil hinter den Kopf.","Schrittstellung, Oberkörper leicht nach vorne.","Ellbogen zeigen nach vorne-oben und bleiben dort.","Arme strecken, langsam zurück bis zur Dehnung."],fehler:["Ellbogen gehen weit auseinander.","Bewegung aus dem Rücken."],tipp:"Die Dehnung über dem Kopf trainiert den langen Teil vom Trizeps besonders gut.",yt:"Trizepsdrücken über Kopf Kabel richtige Ausführung"},
  kickbacks:{name:"Trizeps-Kickbacks",art:"Kurzhantel",p:["trizeps"],s:[],sets:2,min:12,max:15,rest:90,inc:1,jeSeite:true,start:{kg:4,von:3,bis:6,wie:" (eine Hantel)"},std:[4,9,16,26,37],
    how:["Eine Hand auf die Bank, vorgebeugt, Rücken gerade.","Oberarm eng am Körper, parallel zum Boden.","Unterarm nach hinten strecken, bis der Arm gerade ist.","Kurz halten, langsam zurück. Dann Seite wechseln."],fehler:["Oberarm sackt nach unten.","Mit Schwung arbeiten."],tipp:"Leichtes Gewicht – hier zählt die saubere Streckung.",yt:"Trizeps Kickbacks Kurzhantel richtige Ausführung"},
  kh_bank:{name:"Kurzhantel-Bankdrücken",art:"Kurzhanteln",p:["brust"],s:["schultern","trizeps"],sets:3,min:8,max:12,rest:120,inc:2,start:{kg:10,von:8,bis:12,wie:" je Hand"},std:[16,24,35,48,62],
    how:["Mit den Hanteln auf den Oberschenkeln hinsetzen, beim Hinlegen mitnehmen.","Füße fest am Boden, Schulterblätter zusammen.","Hanteln über der Brust nach oben drücken.","Langsam bis auf Brusthöhe ablassen."],fehler:["Ellbogen 90° zur Seite.","Hanteln unten fallen lassen."],tipp:"Zum Aufhören Hanteln zur Brust, Knie hoch und aufsetzen – nicht seitlich fallen lassen.",yt:"Kurzhantel Bankdrücken richtige Ausführung"},
  brustpresse:{name:"Brustpresse",art:"Maschine",p:["brust"],s:["schultern","trizeps"],sets:3,min:8,max:12,rest:120,inc:2.5,start:{kg:20,von:20,bis:30,wie:""},std:[33,53,80,112,147],
    how:["Sitz so einstellen, dass die Griffe auf Höhe der Brustmitte sind.","Schulterblätter nach hinten-unten, Brust raus.","Griffe nach vorne drücken, Arme nicht ganz durchstrecken.","Langsam zurück, bis du eine Dehnung in der Brust spürst."],fehler:["Schultern hochziehen.","Gewicht zurückfallen lassen."],tipp:"Erst die Maschine einstellen, dann das Gewicht wählen.",yt:"Brustpresse Maschine richtige Ausführung"},
  butterfly:{name:"Butterfly",art:"Maschine",p:["brust"],s:[],sets:3,min:12,max:15,rest:90,inc:2.5,start:{kg:20,von:15,bis:30,wie:""},std:[36,55,79,107,139],
    how:["Sitz so einstellen, dass die Griffe auf Brusthöhe sind.","Arme leicht gebeugt lassen.","Griffe vor der Brust zusammenführen.","Langsam öffnen, bis du Dehnung spürst – nicht weiter."],fehler:["Arme ganz gestreckt.","Zu weit nach hinten öffnen."],tipp:"Stell dir vor, du umarmst einen Baum.",yt:"Butterfly Maschine richtige Ausführung"},
  latziehen:{name:"Latziehen",art:"Kabelzug",p:["lat"],s:["bizeps","oben"],sets:3,min:8,max:12,rest:120,inc:2.5,start:{kg:25,von:25,bis:35,wie:""},std:[42,57,77,99,123],
    how:["Oberschenkel unter das Polster klemmen.","Stange etwas breiter als schulterbreit greifen.","Brust raus, leicht nach hinten lehnen.","Stange zur oberen Brust ziehen, Ellbogen nach unten. Langsam zurück."],fehler:["Schwung mit dem Oberkörper.","Stange in den Nacken ziehen."],tipp:"Denk an „Ellbogen in die Hosentaschen“.",yt:"Latziehen richtige Ausführung"},
  kabelrudern:{name:"Rudern am Kabel",art:"Kabelzug",p:["oben","lat"],s:["bizeps"],sets:3,min:10,max:12,rest:120,inc:2.5,start:{kg:25,von:25,bis:35,wie:""},std:[40,57,78,102,128],
    how:["Aufrecht sitzen, Füße auf den Stützen, Knie leicht gebeugt.","Griff zum Bauch ziehen, Ellbogen nah am Körper.","Schulterblätter am Ende zusammendrücken.","Kontrolliert nach vorne lassen."],fehler:["Weit nach hinten lehnen.","Runder Rücken."],tipp:"Der Oberkörper bleibt fast ruhig.",yt:"Rudern am Kabel sitzend richtige Ausführung"},
  kh_rudern:{name:"Einarmiges Kurzhantel-Rudern",art:"Kurzhantel",p:["lat"],s:["oben"],sets:3,min:10,max:12,rest:90,inc:2,jeSeite:true,start:{kg:12,von:10,bis:14,wie:" (eine Hantel)"},std:[16,25,38,53,69],
    how:["Eine Hand und ein Knie auf die Bank, Rücken gerade wie ein Tisch.","Hantel Richtung Hüfte ziehen, Ellbogen nah am Körper.","Langsam ablassen.","Erst alle Wdh. mit einem Arm, dann Seite wechseln."],fehler:["Oberkörper dreht mit auf.","Runder Rücken."],tipp:"Trag die Wdh. für eine Seite ein – beide Seiten gleich viele.",yt:"Einarmiges Kurzhantelrudern richtige Ausführung"},
  goblet:{name:"Goblet Squat",art:"Kurzhantel",p:["quadrizeps"],s:["po"],sets:2,min:8,max:12,rest:120,inc:2,start:{kg:12,von:10,bis:16,wie:" (eine Hantel)"},std:[13,24,38,55,75],
    how:["Eine Kurzhantel senkrecht vor der Brust halten.","Füße schulterbreit, Zehen leicht nach außen.","Hüfte nach hinten-unten, so tief wie sauber möglich.","Brust bleibt oben, durch die ganze Fußsohle hochdrücken."],fehler:["Fersen heben ab.","Knie fallen nach innen."],tipp:"Ideal, um die Kniebeuge zu lernen.",yt:"Goblet Squat richtige Ausführung"},
  beinpresse:{name:"Beinpresse",art:"Maschine",p:["quadrizeps"],s:["po"],sets:2,min:10,max:12,rest:120,inc:5,start:{kg:40,von:40,bis:60,wie:""},std:[90,139,202,277,359],
    how:["Rücken und Po fest ans Polster.","Füße schulterbreit mittig auf die Platte.","Langsam ablassen, bis die Knie ca. 90° gebeugt sind.","Über die ganze Fußsohle zurückdrücken."],fehler:["Knie oben ganz durchdrücken.","Po rollt unten vom Polster weg."],tipp:"Die Knie zeigen immer in Richtung Zehen.",yt:"Beinpresse richtige Ausführung"},
  beinstrecker:{name:"Beinstrecker",art:"Maschine",p:["quadrizeps"],s:[],sets:2,min:12,max:15,rest:90,inc:2.5,start:{kg:20,von:20,bis:30,wie:""},std:[42,65,95,130,169],
    how:["Knie auf Höhe des Drehpunkts, Polster vorne über dem Sprunggelenk.","Beine nach oben strecken, oben 1 Sek. halten.","Langsam ablassen."],fehler:["Mit Schwung hochkicken.","Po hebt vom Sitz ab."],tipp:"An den Griffen festhalten, dann bleibt der Po unten.",yt:"Beinstrecker richtige Ausführung"},
  rdl:{name:"Rumänisches Kreuzheben",art:"Kurzhanteln",p:["beinbeuger","po"],s:["unten"],sets:2,min:8,max:12,rest:120,inc:2,start:{kg:10,von:8,bis:14,wie:" je Hand"},std:[16,26,39,55,72],
    how:["Hüftbreit stehen, Hanteln vor den Oberschenkeln, Knie leicht gebeugt.","Po nach hinten schieben, Oberkörper kippt nach vorne.","Runter, bis du hinten im Oberschenkel Zug spürst.","Hüfte nach vorne schieben und aufrichten."],fehler:["Runder Rücken – Rücken bleibt immer gerade!","Kniebeuge statt Hüftbewegung."],tipp:"Technik vor Gewicht. Lass im Studio kurz einen Trainer drüberschauen.",yt:"Rumänisches Kreuzheben Kurzhantel richtige Ausführung"},
  hip_thrust:{name:"Hip Thrust",art:"Langhantel oder Maschine",p:["po"],s:["beinbeuger"],sets:2,min:10,max:15,rest:120,inc:5,start:{kg:30,von:20,bis:40,wie:""},std:[45,80,129,189,257],
    how:["Oberer Rücken an die Bankkante, Füße hüftbreit aufstellen.","Stange mit Polster quer über die Hüfte legen (oder den Gurt der Maschine).","Hüfte hochdrücken, bis Schultern, Hüfte und Knie eine Linie bilden.","Oben den Po anspannen, langsam ablassen."],fehler:["Hohlkreuz oben.","Füße zu weit weg."],tipp:"Die leere Stange (20 kg) reicht am Anfang. Immer mit Polster.",yt:"Hip Thrust Langhantel richtige Ausführung"},
  beinbeuger:{name:"Beinbeuger sitzend",art:"Maschine",p:["beinbeuger"],s:[],sets:2,min:10,max:15,rest:90,inc:2.5,start:{kg:15,von:15,bis:25,wie:""},std:[34,52,76,103,134],
    how:["Knie auf Höhe des Drehpunkts der Maschine.","Unteres Polster knapp über der Ferse, oberes fest auf den Oberschenkeln.","Beine nach unten-hinten beugen, kurz halten.","Langsam zurück."],fehler:["Mit Schwung arbeiten.","Gewicht zurückschnellen lassen."],tipp:"Die langsame Rückbewegung ist hier besonders wirksam.",yt:"Beinbeuger sitzend richtige Ausführung"},

function planOf(k) { const w = S.workouts[k]; return (w && w.plan) || (isPlanned(k) ? DAYS[parseKey(k).getDay()] : null); }

function suggest(id, k) {

    return {kg:ex.start.kg, text:"<b>Startgewicht:</b> ca. " + fmtNum(ex.start.kg) + " kg" + ex.start.wie + " (Richtwert " + fmtNum(ex.start.von) + "–" + fmtNum(ex.start.bis) + " kg). 1. Satz = Testsatz: mehr als " + (ex.max + 3) + " Wdh. locker → schwerer, keine " + ex.min + " → leichter."};

/* ---------- Status, Statistik ---------- */
function dayStatus(k) {
  const w = S.workouts[k], t = todayKey();
  if (w) { if (w.status === "done" || w.status === "manual") return "done"; if (w.status === "excused") return "excused"; if (w.status === "missed") return "missed"; if (hasLogged(w)) return k < t ? "done" : "draft"; }
  if (!isPlanned(k)) return "";
  return k < t ? "missed" : k === t ? "today" : "planned";
}
function stats() {
  const t = todayKey(); let planned = 0, done = 0, total = 0, month = 0, streak = 0;
  for (let k = addDays(t, -27); k <= t; k = addDays(k, 1)) { if (!isPlanned(k)) continue; const st = dayStatus(k); if (st === "excused" || (k === t && st !== "done")) continue; planned++; if (st === "done") done++; }
  for (const k of Object.keys(S.workouts)) if (dayStatus(k) === "done") { total++; if (k.slice(0, 7) === t.slice(0, 7)) month++; }
  for (let k = t; k >= start(); k = addDays(k, -1)) { if (!isPlanned(k)) continue; const st = dayStatus(k); if (k === t && st !== "done") continue; if (st === "done") streak++; else if (st === "excused") continue; else break; }
  return {quote: planned ? Math.round(done / planned * 100) : null, total, month, streak};
}

function nextUp() {

  return null;
}

function weekSets() {

function niceTicks(min, max, n) {
  if (min === max) { const p = Math.max(1, Math.abs(min) * 0.05); min -= p; max += p; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / mag, step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6)); return out;
}
function lineChart(pts, unit) {
  if (!pts.length) return "";
  const W = 320, H = 180, L = 42, R = 14, T = 14, B = 28, xs = pts.map(p => parseKey(p.d).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
  const tk = niceTicks(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)), 4), y0 = tk[0], y1 = tk[tk.length - 1];
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Verlauf">';
  tk.forEach(v => s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + fmtNum(v) + '</text>');
  const P = pts.map((p, i) => [X(xs[i]), Y(p.y)]);
  if (P.length > 1) { const ln = P.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" "); s += '<path d="' + ln + ' L' + P[P.length - 1][0].toFixed(1) + ' ' + Y(y0) + ' L' + P[0][0].toFixed(1) + ' ' + Y(y0) + ' Z" fill="var(--soft)"/><path d="' + ln + '" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round"/>'; }
  P.forEach((q, i) => { const last = i === P.length - 1; s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (last ? 5 : 3) + '" fill="' + (last ? "var(--fg)" : "var(--bg)") + '" stroke="var(--fg)" stroke-width="2"/>'; });
  const lp = P[P.length - 1];
  s += '<text x="' + Math.min(lp[0], W - R) + '" y="' + Math.max(lp[1] - 10, 11) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--fg)">' + fmtNum(pts[pts.length - 1].y) + ' ' + unit + '</text><text x="' + L + '" y="' + (H - 8) + '" font-size="11" fill="var(--muted)">' + fmtDate(pts[0].d, {day:"2-digit", month:"2-digit"}) + '</text>';
  if (pts.length > 1) s += '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + fmtDate(pts[pts.length - 1].d, {day:"2-digit", month:"2-digit"}) + '</text>';
  return s + "</svg>";
}

/* ---------- Seite: LEVEL & KILOS – wie weit bist du? ---------- */
// Bester Satz vom letzten Training mit dieser Übung
function lastSet(id) {
  const h = history(id, addDays(todayKey(), 1)); if (!h.length) return null;
  let best = null, bs = -1;
  okSets(h[0], id).forEach(x => { const sc = score(id, num(x.kg) || 0, num(x.r)); if (sc > bs) { bs = sc; best = x; } });
  return best ? {kg:num(best.kg) || 0, r:num(best.r), date:h[0].date} : null;
}
// Wie weit bist du im aktuellen Level? (0–100 %)
function lvProgress(id, sc, l) { if (l >= 5) return 100; const std = EX[id].std, lo = l > 0 ? std[l - 1] : 0, hi = std[l]; return Math.max(4, Math.min(100, Math.round((sc - lo) / (hi - lo) * 100))); }
function lvRow(id) {
  const ex = EX[id], b = bestEver(id), unit = ex.zeit ? " Sek." : " Wdh.";
  if (!noKg(ex)) {   // Übung mit Gewicht: hier einstellen
    const t = todayKey(), kg = curKg(id, t), r = 10, sc = score(id, kg, r), l = levelOf(id, sc), ls = lastSet(id);
    const nx = l >= 5 ? "Höchstes Level 👑" : "Für " + badgeTxt(l + 1) + ": ca. " + fmtNum(needKg(id, l + 1, r)) + " kg × 10";
    return '<li class="kgrow"><div class="kg-top"><button type="button" class="link kg-name" data-act="info" data-ex="' + id + '">' + esc(ex.name) + '</button>' + badge(l) + '</div>'
      + '<div class="stepper sm"><button type="button" data-act="kgs" data-ex="' + id + '" data-d="-1" aria-label="Weniger Gewicht ' + esc(ex.name) + '">−</button><input class="kg-in" data-ex="' + id + '" inputmode="decimal" autocomplete="off" aria-label="Gewicht ' + esc(ex.name) + ' in kg" value="' + String(kg).replace(".", ",") + '"><span>kg' + esc(ex.start.wie) + '</span><button type="button" data-act="kgs" data-ex="' + id + '" data-d="1" aria-label="Mehr Gewicht ' + esc(ex.name) + '">+</button></div>'
      + '<span class="lvbar" aria-hidden="true"><i style="width:' + lvProgress(id, sc, l) + '%"></i></span><small class="muted">' + nx + (ls ? ' · Zuletzt: ' + fmtNum(ls.kg) + ' kg × ' + ls.r : ' · Noch nicht trainiert') + '</small></li>';
  }
  if (b == null) return '<li><button type="button" class="row" data-act="info" data-ex="' + id + '"><span><b>' + esc(ex.name) + '</b><small>Noch nicht gemacht · ' + startTxt(id) + '</small></span><span class="lv off">–</span></button></li>';
  const l = levelOf(id, b), ls = lastSet(id);
  const now = noKg(ex) ? "Bester Satz: " + fmtNum(b) + unit : "Zuletzt: " + (ls ? fmtNum(ls.kg) + " kg × " + ls.r : "–");
  const nx = l >= 5 ? "Höchstes Level erreicht 👑" : "Nächstes: " + badgeTxt(l + 1) + (noKg(ex) ? " ab " + ex.std[l] + unit : " ab ca. " + fmtNum(needKg(id, l + 1, 10)) + " kg × 10");
  return '<li><button type="button" class="row" data-act="info" data-ex="' + id + '"><span><b>' + esc(ex.name) + '</b><small>' + now + '</small><span class="lvbar" aria-hidden="true"><i style="width:' + lvProgress(id, b, l) + '%"></i></span><small>' + nx + '</small></span>' + badge(l) + '</button></li>';
}

const VIEWS = {start:viewStart, plan:viewPlan, "tag-a":() => viewTag("A"), "tag-b":() => viewTag("B"), "tag-c":() => viewTag("C"), training:viewTraining, dehnen:viewDehnen, kalender:viewKalender, mehr:viewMehr, uebungen:viewUebungen, kilos:viewLevel, level:viewLevel, fortschritt:viewLevel, wissen:viewWissen};
const TAB_OF = {start:"start", plan:"plan", "tag-a":"plan", "tag-b":"plan", "tag-c":"plan", dehnen:"dehnen", kalender:"kalender", uebungen:"uebungen", kilos:"kilos", level:"kilos", fortschritt:"kilos"};
function currentView() { const v = location.hash.replace("#", ""); return VIEWS[v] ? v : "start"; }
function render() {
  const v = currentView(); UI.needRender = false;
  $("#main").innerHTML = VIEWS[v]();
  document.body.classList.toggle("focus", v === "training");
  if ($("#moreBtn")) { if (v === "mehr" || v === "wissen") $("#moreBtn").setAttribute("aria-current", "page"); else $("#moreBtn").removeAttribute("aria-current"); }
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.tab === TAB_OF[v]) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (UI.sheet) renderSheet();
}
function softRender() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("#main").contains(a)) { UI.needRender = true; return; } render(); }
function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; window.scrollTo(0, 0); }
function openSheet(kind, arg) { UI.sheet = {kind, arg}; renderSheet(); $("#sheetWrap").hidden = false; }
function renderSheet() { const s = UI.sheet; if (!s) return; $("#sheet").innerHTML = s.kind === "info" ? infoSheet(s.arg) : s.kind === "st" ? stretchSheet(s.arg) : s.kind === "wt" ? wtSheet(s.arg) : daySheet(s.arg); }
// Kleines Fenster im Training: Gewicht schnell ändern
function wtSheet(id) {
  const t = todayKey(), kg = curKg(id, t);
  return '<div class="sheet-top"><div><p class="eyebrow">Gewicht ändern</p><h2>' + esc(EX[id].name) + '</h2></div><button class="icon-btn" data-act="close" aria-label="Schließen">' + X_ICON + '</button></div>'
    + '<div class="stepper"><button type="button" data-act="wt" data-d="-1" aria-label="Weniger Gewicht">−</button><input id="wtIn" inputmode="decimal" autocomplete="off" aria-label="Gewicht in kg" value="' + String(kg).replace(".", ",") + '"><span>kg</span><button type="button" data-act="wt" data-d="1" aria-label="Mehr Gewicht">+</button></div>'
    + '<div id="lvBox">' + lvBox(id, t) + '</div><button class="btn primary" data-act="close">Fertig</button>';
}
function closeSheet() { UI.sheet = null; if (UI.confirm && UI.confirm.startsWith("del-")) UI.confirm = null; $("#sheetWrap").hidden = true; $("#sheet").innerHTML = ""; }
let toastT = null;
function toast(m, ms) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms || 2600); }

/* ---------- Pausen-Timer ---------- */
const T = {end:0, total:0, id:null};
let audio = null, wakeLock = null;
function unlockAudio() { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {} }
function beep() {
  try { if (audio) [0, 0.25].forEach(o => { const os = audio.createOscillator(), g = audio.createGain(); os.frequency.value = 880; g.gain.value = 0.15; os.connect(g); g.connect(audio.destination); os.start(audio.currentTime + o); os.stop(audio.currentTime + o + 0.15); }); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function startTimer(sec, label) { T.total = sec; T.end = Date.now() + sec * 1000; $("#timerL").textContent = label; $("#timer").hidden = false; clearInterval(T.id); T.id = setInterval(tick, 250); tick(); }
function tick() { const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000)); $("#timerT").textContent = mmss(left); $("#timerP").style.width = (T.total ? (1 - left / T.total) * 100 : 100) + "%"; if (left <= 0) { clearInterval(T.id); $("#timerL").textContent = "Pause vorbei – nächster Satz!"; beep(); } }
function stopTimer() { clearInterval(T.id); $("#timer").hidden = true; }
async function keepAwake() { try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch (e) {} }

/* ---------- Eingaben im Training ---------- */
function curEx() { const p = todayPlan(); return p ? planEx(p)[UI.step] : null; }
function rowCtx(el) {
  const sec = el.closest(".ex"), row = el.closest(".set"); if (!sec || !row) return null;
  const t = todayKey(), w = ensureWorkout(t, todayPlan()), id = sec.dataset.ex, i = +row.dataset.i, n = setsFor(id, t);
  if (!w.ex[id]) w.ex[id] = []; while (w.ex[id].length < n) w.ex[id].push({kg:null, r:null, ok:false});
  return {t, w, id, i, row, set:w.ex[id][i]};
}
function updateProg() { const t = todayKey(), p = todayPlan(), bar = $(".prog"); if (bar && p) bar.outerHTML = progBar(p, t, UI.step); }
// Gewicht geändert: Anzeige, Level und offene Sätze sofort anpassen
// Gewicht im Bereich „Kilos“ merken
function saveKg(id, kg, t) { if (!S.settings.kg) S.settings.kg = {}; S.settings.kg[id] = {kg, d:t}; changed("settings"); }
function setWeight(kg) {
  const id = curEx(), t = todayKey(); if (!id || noKg(EX[id])) return;
  kg = Math.max(0, Math.round(kg * 10) / 10);
  const w = ensureWorkout(t, todayPlan()); if (!w.wt) w.wt = {}; w.wt[id] = kg; changed("w-" + t);   // gilt für heute; danach rechnet die App weiter
  const l = levelOf(id, score(id, kg, refReps(id, t)));
  if ($("#wtSum")) $("#wtSum").textContent = fmtNum(kg) + " kg";
  if ($("#lvSum")) $("#lvSum").innerHTML = badge(l);
  if ($("#lvBox")) $("#lvBox").innerHTML = lvBox(id, t);
  if (document.activeElement !== $("#wtIn") && $("#wtIn")) $("#wtIn").value = String(kg).replace(".", ",");
  document.querySelectorAll(".set").forEach(r => { if (!r.classList.contains("ok")) r.querySelector(".set-kg").textContent = fmtNum(kg) + " kg ×"; });
}
// Neuer Rekord oder Level-Aufstieg? (eigene Idee)
function cheer(id, t, set) {
  const sc = score(id, num(set.kg) || 0, num(set.r)), prev = bestEver(id, t);
  const others = okSets(S.workouts[t], id).filter(s => s !== set).map(s => score(id, num(s.kg) || 0, num(s.r)));
  if (prev == null) { if (!UI.seen[id]) { UI.seen[id] = 1; return "Dein Start-Level: " + badgeTxt(levelOf(id, sc)); } return null; }
  const best = Math.max(prev, ...others);
  if (sc > best + 0.05) { const lo = levelOf(id, best), ln = levelOf(id, sc); return ln > lo ? "LEVEL UP! " + badgeTxt(ln) : "🏆 Neuer Rekord!"; }
  return null;
}

document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches(".in-r")) { const c = rowCtx(el); if (c) { c.set.r = num(el.value); changed("w-" + c.t); } }
  else if (el.id === "wtIn") { const v = num(el.value); if (v != null) setWeight(v); }
  else if (el.id === "note") { const t = todayKey(), w = ensureWorkout(t, todayPlan()); w.note = el.value; changed("w-" + t); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "chartSel") { UI.chartEx = el.value; render(); }
  else if (el.id === "startD" && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) { S.settings.startDate = el.value; changed("settings"); toast("Plan-Start gespeichert"); }
  else if (el.id === "wtIn") { const v = num(el.value); if (v != null) { setWeight(v); el.value = String(v).replace(".", ","); } }
  else if (el.matches(".kg-in")) { const v = num(el.value); if (v != null && v >= 0) { saveKg(el.dataset.ex, Math.round(v * 10) / 10, todayKey()); softRender(); } }
});
document.addEventListener("toggle", e => { if (e.target && e.target.id === "wt") UI.wtOpen = e.target.open; }, true);
document.addEventListener("focusout", () => setTimeout(() => { if (UI.needRender) softRender(); }, 50));

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) { if (e.target === $("#sheetWrap")) closeSheet(); return; }
  const act = b.dataset.act, t = todayKey();
  switch (act) {
    case "go": closeSheet(); go(b.dataset.h); break;
    case "uxf": UI.uxTag = b.dataset.v; render(); break;     // Filter auf der Übungen-Seite
    case "lvf": UI.lvTag = b.dataset.v; render(); break;     // Tag auf der Kilos-Seite
    case "kgs": { const id = b.dataset.ex, ex = EX[id]; saveKg(id, Math.max(0, Math.round((curKg(id, t) + (+b.dataset.d) * (ex.inc || 1)) * 10) / 10), t); render(); break; }
    case "wtsheet": { const id = curEx(); if (id) openSheet("wt", id); break; }
    case "start": {
      const p = b.dataset.p, w = S.workouts[t];
      if (w && hasLogged(w) && w.plan !== p) toast("Heute läuft schon " + PLAN[w.plan].name);
      else { UI.pick = p; if (w) { w.plan = p; if (["manual", "missed", "excused"].includes(w.status)) w.status = "draft"; changed("w-" + t); } }
      UI.from = currentView() === "training" ? (UI.from || "start") : currentView();   // merken, woher man kam
      UI.step = null; UI.wtOpen = false; go("training"); break;
    }
    case "exit": stopTimer(); go(UI.from || "start"); toast("Fortschritt gespeichert – mach später einfach weiter"); break;
    case "next": UI.step++; UI.wtOpen = false; stopTimer(); render(); window.scrollTo(0, 0); break;
    case "prev": UI.step = Math.max(0, UI.step - 1); UI.wtOpen = false; render(); window.scrollTo(0, 0); break;
    case "jump": UI.step = +b.dataset.i; UI.wtOpen = false; render(); window.scrollTo(0, 0); break;
    case "wt": { const id = curEx(); if (!id) return; setWeight(curKg(id, t) + (+b.dataset.d) * (EX[id].inc || 1)); break; }
    case "chk": {
      unlockAudio();
      const c = rowCtx(b); if (!c) return;
      const ex = EX[c.id];
      c.set.r = num(c.row.querySelector(".in-r").value);
      if (!c.set.ok && (c.set.r == null || c.set.r <= 0)) { toast(ex.zeit ? "Trag die Sekunden ein" : "Trag kurz deine Wdh. ein"); c.row.querySelector(".in-r").focus(); return; }
      if (!c.set.ok) c.set.kg = noKg(ex) ? null : curKg(c.id, c.t);
      c.set.ok = !c.set.ok; c.row.classList.toggle("ok", c.set.ok); b.setAttribute("aria-pressed", String(c.set.ok)); changed("w-" + c.t); updateProg();
      if (c.set.ok) {
        keepAwake();
        const msg = cheer(c.id, c.t, c.set);
        const left = okSets(c.w, c.id).length < setsFor(c.id, c.t);
        if (left) startTimer(ex.rest, ex.name + " · Satz " + (c.i + 1) + " ✓"); else stopTimer();
        if (msg) toast(msg, 3200); else if (!left) toast("Übung fertig ✓ – tipp auf Weiter");
        if ($("#lvBox")) $("#lvBox").innerHTML = lvBox(c.id, c.t);
      }
      break;
    }
    case "t-plus": T.end += 30000; T.total += 30; clearInterval(T.id); T.id = setInterval(tick, 250); tick(); break;
    case "t-minus": T.end = Math.max(Date.now(), T.end - 15000); tick(); break;
    case "t-stop": stopTimer(); break;
    case "feel": { const w = ensureWorkout(t, todayPlan()); w.feel = +b.dataset.v; changed("w-" + t); document.querySelectorAll(".feel button").forEach(x => x.classList.toggle("on", x === b)); break; }
    case "finish": {
      // Abschließen: der Tag steht danach im Kalender (auch ohne eingetragene Sätze)
      const w = ensureWorkout(t, todayPlan()); w.status = "done"; w.finishedAt = Date.now(); changed("w-" + t);
      stopTimer(); UI.step = null; UI.month = t.slice(0, 7); UI.flash = t;
      setTimeout(() => { UI.flash = null; }, 2500);
      toast("Im Kalender eingetragen ✓ Stark!", 3000); go("kalender"); break;
    }
    case "info": openSheet("info", b.dataset.ex); break;
    case "stinfo": openSheet("st", b.dataset.id); break;
    case "dday": UI.dday = +b.dataset.v; render(); break;
    case "day": openSheet("day", b.dataset.d); break;
    case "close": closeSheet(); break;
    case "setst": { const k = b.dataset.d, w = ensureWorkout(k, planOf(k) || "A"); w.status = b.dataset.st; changed("w-" + k); toast("Eingetragen"); renderSheet(); render(); break; }
    case "askdel": UI.confirm = "del-" + b.dataset.d; renderSheet(); break;
    case "deld": { const k = b.dataset.d; delete S.workouts[k]; UI.confirm = null; changed("w-" + k); toast("Gelöscht"); closeSheet(); render(); break; }
    case "cancel": UI.confirm = null; if (UI.sheet) renderSheet(); render(); break;
    case "mon": { const [y, m] = UI.month.split("-").map(Number), d = new Date(y, m - 1 + (+b.dataset.n), 1); UI.month = d.getFullYear() + "-" + pad(d.getMonth() + 1); render(); break; }
    case "cadd": {
      const name = $("#cName").value.trim(); if (!name) { toast("Gib der Übung einen Namen"); $("#cName").focus(); return; }
      S.stretch.custom.push({id:"c" + Date.now().toString(36), name, dose:$("#cDose").value.trim(), side:$("#cSide").value, note:$("#cNote").value.trim()});
      changed("stretch"); toast("Gespeichert"); render(); break;
    }
    case "cdel": UI.confirm = "cdel-" + b.dataset.id; render(); break;
    case "cdel2": { const id = UI.confirm.slice(5); S.stretch.custom = S.stretch.custom.filter(c => c.id !== id); UI.confirm = null; changed("stretch"); toast("Gelöscht"); render(); break; }
    case "body": {
      const d = $("#bD").value, kg = num($("#bKg").value);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || kg == null) { toast("Datum und Gewicht eintragen"); return; }
      if (kg < 30 || kg > 250) { toast("Gewicht prüfen – das sieht nicht richtig aus"); return; }
      const ent = S.body.entries || (S.body.entries = []), old = ent.find(x => x.d === d); if (old) old.kg = kg; else ent.push({d, kg, arm:null, waist:null});
      changed("body"); toast("Gespeichert"); render(); break;
    }
    case "export": $("#dataBox").innerHTML = '<div class="field"><label for="exp">Deine Sicherung – kopieren und z. B. in Obsidian ablegen</label><textarea id="exp" readonly rows="5"></textarea></div><button class="btn" data-act="copy">Kopieren</button>'; $("#exp").value = JSON.stringify(S); break;
    case "copy": { const ta = $("#exp"); try { await navigator.clipboard.writeText(ta.value); toast("Kopiert"); } catch (err) { ta.focus(); ta.select(); toast("Text markiert – jetzt kopieren"); } break; }
    case "import": $("#dataBox").innerHTML = '<div class="field"><label for="imp">Sicherung hier einfügen</label><textarea id="imp" rows="5"></textarea></div><p class="small"><b>⚠️ Achtung:</b> Das ersetzt alle aktuellen Daten.</p><button class="btn primary" data-act="import2">Ersetzen & importieren</button>'; break;
    case "import2": {
      let o; try { o = JSON.parse($("#imp").value); } catch (err) { toast("Keine gültige Sicherung"); return; }
      if (!o || !o.settings || !o.workouts || typeof o.workouts !== "object") { toast("Keine gültige Sicherung"); return; }
      const old = allKeys(); S = Object.assign(freshState(), o); new Set(old.concat(allKeys())).forEach(k => changed(k)); toast("Importiert"); render(); break;
    }
    case "reset": UI.confirm = "reset"; render(); break;
    case "reset2": { const old = allKeys(); UI.confirm = null; S = freshState(); old.forEach(k => changed(k)); SINGLE.forEach(k => changed(k)); toast("Alles gelöscht"); render(); break; }
  }
});

/* ---------- Kopfzeile ---------- */
$("#fsBtn").addEventListener("click", async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else toast("Vollbild geht hier nicht – nutz „Zum Home-Bildschirm“"); }
  catch (e) { toast("Vollbild geht hier nicht – nutz „Zum Home-Bildschirm“"); }
});
(function () {
  try { const th = localStorage.getItem("hantelbuch.theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  $("#themeBtn").addEventListener("click", () => { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), nx = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); try { localStorage.setItem("hantelbuch.theme", nx); } catch (e) {} });
})();

/* ---------- Start ---------- */
window.addEventListener("hashchange", () => { UI.confirm = null; if (currentView() !== "training") stopTimer(); render(); window.scrollTo(0, 0); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheetWrap").hidden) closeSheet(); });
loadLocal(); migrate(); setSync("local"); render(); initCloud();
</script>

</script>
